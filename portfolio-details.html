<script>
  const projects = [
    // Existing projects...
    {
      name: 'Aura Music',
      description: 'An innovative music streaming platform.',
      github: 'https://github.com/Neelayaswanth/aura-music'
    }
  ];

  // Existing code to render projects...
  projects.forEach(project => {
    const projectElement = document.createElement('div');
    projectElement.innerHTML = `<h2>${project.name}</h2><p>${project.description}</p>`;
    if (project.github) {
      projectElement.innerHTML += `<a href='${project.github}' target='_blank'>View on GitHub</a>`;
    }
    document.body.appendChild(projectElement);
  });
</script>
