            </div>
            <h2>Project Not Found</h2>
            <p>The requested project could not be found or may have been moved.</p>
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
              <a href="index.html#portfolio" class="btn btn-primary">
                <i class="bi bi-images me-2"></i>View All Projects
              </a>
              <a href="index.html" class="btn btn-outline-secondary">
                <i class="bi bi-house me-2"></i>Back to Home
              </a>
            </div>
          </div>
        `;
        return;
      }

      const project = projects[projectId];
      
      document.getElementById('page-title').textContent = project.title;
      document.getElementById('breadcrumb-project').textContent = project.title;
      document.title = `${project.title} - Neela Yaswanth`;

      const featuresHtml = project.features.map(f => `<li><i class="bi bi-check-circle"></i> ${f}</li>`).join('');
      const techStackHtml = project.techStack.map(t => `<span class="badge bg-primary me-1 mb-1">${t}</span>`).join('');

      document.getElementById('project-content').innerHTML = `
        <div class="col-lg-8 col-md-12 order-1 order-lg-1">
          <div class="live-preview-container">
            <div class="live-preview-header">
              <div class="browser-dots">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="browser-url">
                <i class="bi bi-lock-fill me-2"></i>${project.url}
              </div>
              <div class="browser-actions">
                <a href="${project.url}" target="_blank" rel="noopener noreferrer" title="Open in new tab">
                  <i class="bi bi-box-arrow-up-right"></i>
                </a>
                <a href="javascript:void(0)" onclick="document.getElementById('live-preview-frame').src = document.getElementById('live-preview-frame').src" title="Refresh">
                  <i class="bi bi-arrow-clockwise"></i>
                </a>
              </div>
            </div>
            <div class="preview-loading" id="preview-loading">
              <div class="spinner"></div>
              <p>Loading live preview...</p>
            </div>
            <div class="preview-fallback" id="preview-fallback">
              <i class="bi bi-globe"></i>
              <p>Live preview unavailable due to security restrictions.</p>
              <a href="${project.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm">
                <i class="bi bi-box-arrow-up-right me-2"></i>Open in New Tab
              </a>
            </div>
            <iframe 
              id="live-preview-frame"
              class="live-preview-iframe" 
              src="${project.url}" 
              title="${project.title} - Live Preview"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
              loading="lazy"
              onload="document.getElementById('preview-loading').style.display='none';"
              onerror="handleIframeError()">
            </iframe>
          </div>
        </div>

        <div class="col-lg-4 col-md-12 order-2 order-lg-2">
          <div class="portfolio-info" data-aos="fade-up" data-aos-delay="200">
            <h3>Project Information</h3>
            <ul>
              <li><strong>Category</strong>${project.category}</li>
              <li><strong>Project Type</strong>${project.client}</li>
              <li><strong>Year</strong>${project.date}</li>
              <li><strong>Live URL</strong><a href="${project.url}" target="_blank" rel="noopener noreferrer">${project.url}</a></li>
              <li><strong>Source Code</strong><a href="${project.github}" target="_blank" rel="noopener noreferrer">View on GitHub</a></li>
            </ul>
          </div>
          <div class="portfolio-description" data-aos="fade-up" data-aos-delay="300">
            <h2>${project.title}</h2>
            <p>${project.description}</p>
            
            <h4 class="mt-4">Key Features</h4>
            <ul class="list-unstyled features-list">
              ${featuresHtml}
            </ul>

            <h4 class="mt-4">Tech Stack</h4>
            <div class="tech-stack">
              ${techStackHtml}
            </div>

            <div class="mt-4 action-buttons">
              <a href="${project.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                <i class="bi bi-box-arrow-up-right me-2"></i>Live Demo
              </a>
              <a href="${project.github}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary">
                <i class="bi bi-github me-2"></i>Source Code
              </a>
            </div>
          </div>
        </div>
      `;

      // Handle iframe load timeout - show fallback if iframe doesn't load in 10 seconds
      setTimeout(function() {
        var loading = document.getElementById('preview-loading');
        if (loading && loading.style.display !== 'none') {
          handleIframeError();
        }
      }, 10000);
    }

    function handleIframeError() {
      var loading = document.getElementById('preview-loading');
      var fallback = document.getElementById('preview-fallback');
      var iframe = document.getElementById('live-preview-frame');
      
      if (loading) loading.style.display = 'none';
      if (fallback) fallback.style.display = 'block';
      if (iframe) iframe.style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', loadProjectDetails);
  </script>

</body>

</html>
